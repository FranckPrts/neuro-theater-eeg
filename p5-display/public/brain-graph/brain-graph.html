<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEG · BRAIN GRAPHIC</title>
<link href="../vendor/fonts/eeg-brain-graphic.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{
  font-family:'Share Tech Mono',monospace;color:#00ff99;background:#000;
  display:flex;align-items:center;justify-content:center;
}

#app{
  position:relative;
  width:min(100vw, calc(100vh * 9/16));
  height:min(100vh, calc(100vw * 16/9));
  background:#000208;
  display:grid;
  grid-template-rows: auto minmax(0, 1fr) minmax(280px, 38%);
  grid-template-columns: minmax(0, 1fr);
  --cyan:#00ff99;
  --cyan-dim:rgba(0,255,153,.35);
  --line:rgba(0,255,153,.14);
  --ink:#00ff99;
  --ink-mute:rgba(0,255,153,.45);
  overflow:hidden;
}
#brain-panel, #toggle-bar, #band-panel { min-width: 0; min-height: 0; }

/* ── BRAIN PANEL ───────────────────────────────────────────── */
#brain-panel{
  position:relative;overflow:hidden;background:#000208;
}
#brain-canvas{display:block;width:100%;height:100%}

.bk{position:absolute;width:22px;height:22px;pointer-events:none}
.bk::before,.bk::after{content:'';position:absolute;background:rgba(0,255,153,.55)}
.bk::before{top:0;width:100%;height:1.5px}
.bk::after{top:0;height:100%;width:1.5px}
.tl{top:18px;left:18px}
.tr{top:18px;right:18px;transform:scaleX(-1)}
.bl{bottom:18px;left:18px;transform:scaleY(-1)}
.br{bottom:18px;right:18px;transform:scale(-1)}

.hud{
  position:absolute;pointer-events:none;color:rgba(0,255,153,.55);
  font-size:9.5px;letter-spacing:.16em;line-height:1.85;
}
.hud-tl{top:24px;left:48px}
.hud-tr{top:24px;right:48px;text-align:right}
.hud-bl{bottom:28px;left:48px}
.hud-br{bottom:28px;right:48px;text-align:right}
.hud b{color:#00ff99;font-weight:normal}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#00ff99;
  box-shadow:0 0 8px #00ff99;animation:sdot 2s ease-in-out infinite;vertical-align:middle;margin-right:6px}
@keyframes sdot{0%,100%{opacity:1;box-shadow:0 0 8px #00ff99}50%{opacity:.4;box-shadow:0 0 20px #00ff99}}

.el-label{
  color:#00ff99;font-size:8.5px;font-family:'Share Tech Mono',monospace;
  letter-spacing:.08em;background:rgba(0,0,10,.65);
  padding:1px 4px;border-left:1px solid rgba(0,255,153,.5);
  pointer-events:none;white-space:nowrap;line-height:1.4;
}

#load-ov{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:#000208;z-index:50;transition:opacity .7s ease;
}
#load-ov.fade{opacity:0;pointer-events:none}
.load-ring{width:38px;height:38px;border:1.5px solid rgba(0,255,153,.15);
  border-top-color:#00ff99;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Share Tech Mono',monospace;font-size:10px;
  letter-spacing:.22em;color:rgba(0,255,153,.55)}

/* ── TOGGLE BAR ───────────────────────────────────────────── */
#toggle-bar{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:#000308;
  border-top:1px solid rgba(0,255,153,.18);
  border-bottom:1px solid rgba(0,255,153,.18);
  padding:10px 12px;
  min-width:0;
}
.visitor-tog{
  display:flex;align-items:center;gap:10px;
  width:100%;max-width:520px;
}
.vt-lbl{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.24em;
  color:#00ff99;white-space:nowrap;
}
.vt-row{
  display:flex;gap:4px;flex:1;
}
.vt-btn{
  flex:1;background:transparent;
  border:1px solid rgba(0,255,153,.22);
  color:rgba(0,255,153,.45);
  font-family:'Share Tech Mono',monospace;
  padding:5px 0;font-size:12px;cursor:pointer;
  letter-spacing:.08em;transition:all .15s;
  min-width:0;
}
.vt-btn:hover{color:#00ff99;border-color:rgba(0,255,153,.5)}
.vt-btn.on{
  color:#00ff99;border-color:#00ff99;background:rgba(0,255,153,.10);
  box-shadow:inset 0 0 12px rgba(0,255,153,.18);font-weight:bold;
}
#toggle-bar::before,#toggle-bar::after{
  content:'';position:absolute;top:0;bottom:0;width:24%;
  background:repeating-linear-gradient(-45deg,transparent,transparent 6px,rgba(0,255,153,.04) 6px,rgba(0,255,153,.04) 7px);
  pointer-events:none;
}
#toggle-bar::before{left:0}
#toggle-bar::after{right:0}

.tog-lbl{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.24em;
  color:rgba(0,255,153,.45);
  white-space:nowrap;
}
.tog{
  display:flex;border:1px solid rgba(0,255,153,.35);
  background:rgba(0,0,8,.6);position:relative;
  width:100%;max-width:520px;
}
.tog button{
  background:transparent;border:none;cursor:pointer;
  font-family:'Share Tech Mono',monospace;color:rgba(0,255,153,.55);
  padding:7px 10px;letter-spacing:.12em;font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:color .15s,background .15s;
  white-space:nowrap;
  flex:1 1 0;min-width:0;
}
.tog button .lg{font-size:13px;font-weight:bold}
.tog button .sm{font-size:8px;letter-spacing:.18em;opacity:.6}
.tog button:hover{color:#00ff99;background:rgba(0,255,153,.04)}
.tog button.on{color:#00ff99;background:rgba(0,255,153,.10);
  box-shadow:inset 0 0 16px rgba(0,255,153,.10)}
.tog button.on .sm{opacity:.85}
.tog .div{width:1px;background:rgba(0,255,153,.18)}

/* ── BAND PANEL (Brainwave → Language Feature) ───────────── */
#band-panel{
  background:#06080a;
  border-top:1px solid var(--line);
  font-family:'Share Tech Mono',monospace;
  position:relative;
  padding:14px 22px 18px;
  overflow:hidden;
  color:#00ff99;
  min-width:0;
}
.zone-label{
  position:absolute;top:12px;left:18px;
  display:flex;align-items:center;gap:10px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-mute);
  z-index:5;white-space:nowrap;
}
.zone-label .num{
  border:1px solid var(--cyan-dim);color:var(--cyan);
  padding:2px 7px;border-radius:2px;letter-spacing:.16em;font-size:10px;
}
.zone-label .arrow{color:var(--ink-mute);margin:0 2px}

.band-table{
  margin-top:6px;
  display:grid;
  grid-template-columns: minmax(120px, 180px) minmax(0, 1fr);
  column-gap:18px;
  row-gap:2px;
  align-items:stretch;
}
.band-table-head{
  display:contents;
  font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-mute);
}
.band-table-head > *{padding-bottom:10px;border-bottom:1px solid var(--line);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band-cell{padding:9px 0;display:flex;align-items:center;border-bottom:1px solid var(--line);min-width:0}
.band-cell.no-line{border-bottom:none}

.band-name{font-size:14px;letter-spacing:.10em;text-transform:uppercase;font-weight:500;display:flex;align-items:baseline;gap:10px;width:100%}
.band-name .sym{font-size:22px;line-height:1;font-style:italic}
.band-name .freq{font-size:10px;color:rgba(0,255,153,.55);letter-spacing:.08em;font-weight:400;text-transform:lowercase;margin-left:auto;padding-right:6px;white-space:nowrap}

.band-wave{position:relative;width:100%;height:40px}
.band-wave canvas{width:100%;height:100%;display:block}
.band-wave .val{
  position:absolute;top:50%;right:8px;transform:translateY(-50%);
  font-size:14px;font-variant-numeric:tabular-nums;font-weight:500;
  background:rgba(6,8,10,.7);padding:2px 6px;border-radius:2px;
  color:#00ff99;
}

.band-bucket{display:flex;width:100%;min-width:0}
.band-bucket-track{display:grid;grid-template-columns:repeat(4, 1fr);gap:4px;width:100%;min-width:0}
.band-bucket-seg{
  text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:2px;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);
  background:rgba(0,0,0,.25);transition:all .25s;
  font-weight:500;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}
.band-bucket-seg.active{box-shadow:inset 0 0 14px currentColor;font-weight:600}

.band-feature{display:flex;align-items:center;gap:14px;width:100%;min-width:0}
.band-feature .arrow{font-size:12px;color:var(--ink-mute);flex-shrink:0}
.band-feature .name{font-size:15px;letter-spacing:.10em;text-transform:uppercase;font-weight:500;white-space:nowrap}

/* CRT effects */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.045) 2px,rgba(0,0,0,.045) 4px);
}
@keyframes flicker{0%,100%{opacity:1}93%{opacity:.94}94.5%{opacity:1}97%{opacity:.97}}
#app{animation:flicker 9s ease-in-out infinite}

.halo-btn{
  position:absolute;top:14px;right:14px;
  background:rgba(0,0,8,.7);border:1px solid rgba(0,255,153,.4);
  color:rgba(0,255,153,.85);padding:5px 12px;cursor:pointer;
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.12em;
  z-index:30;transition:all .15s;
}
.halo-btn:hover{border-color:#00ff99;color:#00ff99;background:rgba(0,255,153,.08)}
.halo-btn.off{color:rgba(0,255,153,.35);border-color:rgba(0,255,153,.18)}

#eltip{
  position:absolute;display:none;
  background:rgba(0,3,14,.92);border:1px solid rgba(0,255,153,.45);
  padding:5px 11px;font-size:10px;pointer-events:none;
  white-space:nowrap;z-index:20;letter-spacing:.06em;color:#00ff99;
}
</style>
</head>
<body>
<div id="app">

  <!-- ── TOGGLE ── -->
  <div id="toggle-bar">
    <div class="tog">
      <button id="btnEnobio" class="on" onclick="setMontage('enobio')">
        <span class="lg">ENOBIO</span>
        <span class="sm">32 CHANNELS</span>
      </button>
      <div class="div"></div>
      <button id="btnMuse" onclick="setMontage('muse')">
        <span class="lg">MUSE</span>
        <span class="sm">4 CHANNELS</span>
      </button>
    </div>
    <div id="enobio-sub" class="visitor-tog" style="display:flex">
      <span class="vt-lbl">SUBJECT</span>
      <div class="vt-row">
        <button class="vt-btn on" data-color="#b855ff" style="flex:1;cursor:default">KANTOR</button>
      </div>
    </div>
    <div id="visitor-tog" class="visitor-tog" style="display:none">
      <span class="vt-lbl">VISITOR</span>
      <div class="vt-row">
        <button class="vt-btn on" data-v="1" data-color="#ff3d4a" onclick="setVisitor(1)">1</button>
        <button class="vt-btn"    data-v="2" data-color="#ff9b3d" onclick="setVisitor(2)">2</button>
        <button class="vt-btn"    data-v="3" data-color="#ff3d9b" onclick="setVisitor(3)">3</button>
        <button class="vt-btn"    data-v="4" data-color="#3df0a0" onclick="setVisitor(4)">4</button>
        <button class="vt-btn"    data-v="5" data-color="#e6f24a" onclick="setVisitor(5)">5</button>
        <button class="vt-btn"    data-v="6" data-color="#3dd9f0" onclick="setVisitor(6)">6</button>
      </div>
    </div>
  </div>

  <!-- ── BRAIN PANEL ── -->
  <div id="brain-panel">
    <canvas id="brain-canvas"></canvas>
    <div id="load-ov">
      <div class="load-ring"></div>
      <div class="load-txt" id="load-txt">LOADING CORTEX MODEL</div>
    </div>
    <button id="haloBtn" class="halo-btn" onclick="toggleHalo()">⊙ SPHERE ON</button>
    <div id="eltip"></div>
  </div>

  <!-- ── BAND PANEL ── -->
  <div id="band-panel">
    <div class="band-table">
      <div class="band-table-head">
        <div>Brainwave</div>
        <div>Power</div>
      </div>
      <div id="band-rows-host" style="display:contents"></div>
    </div>
  </div>

</div>

<!-- ── BAND ROWS (data-driven build) ── -->
<script>
// Order matches the sketch: α  βH  βL  θ  δ
// Each row maps a frequency band to a language feature.
const MIN_AMP = 0.06;
const MAX_AMP_FRAC = 0.42;
const AMP_SMOOTH = 0.12;
const WAVE_SPATIAL_CYCLES = 2.4;
const FREQ_HZ_SCALE = 0.55;
const ENVELOPE_OVERLAY_ALPHA = 0.37;
const ENVELOPE_HISTORY = 500;
const ENVELOPE_SCROLL = 4;

const MAPPING = [
  {band:'alpha',    sym:'α', name:'ALPHA',     freq:'8–13 hz',  featName:'COHERENCE',   color:'#fbbf24', hz:10.5,  hzScale:0.32},
  {band:'highBeta', sym:'β', name:'HIGH-BETA', freq:'20–30 hz', featName:'VOCABULARY',  color:'#f472b6', hz:25,    hzScale:0.22},
  {band:'lowBeta',  sym:'β', name:'LOW-BETA',  freq:'13–20 hz', featName:'INTENSITY',   color:'#fb923c', hz:16.5,  hzScale:0.28},
  {band:'theta',    sym:'θ', name:'THETA',     freq:'4–8 hz',   featName:'CERTAINTY',   color:'#2dd4bf', hz:6,     hzScale:0.65},
  {band:'delta',    sym:'δ', name:'DELTA',     freq:'0.5–4 hz', featName:'ABSTRACTION', color:'#60a5fa', hz:2.25,  hzScale:1.0},
];
const BUCKET_SHORT = ['MIN','LOW','HIGH','MAX'];
function bucketFor(v){
  if(v < 0.25) return 0;
  if(v < 0.50) return 1;
  if(v < 0.75) return 2;
  return 3;
}

function lerp(a,b,t){ return a + (b - a) * t; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function parseHexColor(h, fallback=[120,160,200]){
  if(typeof h !== 'string') return fallback;
  let s = h.trim();
  if(s.startsWith('0x')) s = '#'+s.slice(2);
  if(!s.startsWith('#')) s = '#'+s;
  const hex = s.slice(1);
  if(hex.length === 3){
    const r=parseInt(hex[0]+hex[0],16), g=parseInt(hex[1]+hex[1],16), b=parseInt(hex[2]+hex[2],16);
    if([r,g,b].every(x=>!isNaN(x))) return [r,g,b];
  }
  if(hex.length === 6){
    const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
    if([r,g,b].every(x=>!isNaN(x))) return [r,g,b];
  }
  return fallback;
}
function neonLineRgb(rgb){
  return [
    clamp(rgb[0] + (255-rgb[0])*0.42, 0, 255),
    clamp(rgb[1] + (255-rgb[1])*0.42, 0, 255),
    clamp(rgb[2] + (255-rgb[2])*0.42, 0, 255),
  ];
}
function effectiveHz(row){
  const scale = typeof row.hzScale === 'number' && isFinite(row.hzScale) ? row.hzScale : 1;
  return row.hz * FREQ_HZ_SCALE * scale;
}
function envelopeY(cy, rowH, v){
  return cy + lerp(rowH * MIN_AMP, -rowH * MAX_AMP_FRAC, clamp(v, 0, 1));
}
function drawEnvelopeScrollCanvas(ctx, w, h, s, m, dt){
  const cy = h * 0.5;
  const rgb = parseHexColor(m.color);
  const power = s.v;
  const buf = s.envelope;
  const span = ENVELOPE_HISTORY;
  const count = Math.min(buf.length, span);

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(0,255,153,0.10)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(w, cy);
  ctx.stroke();

  if(count >= 2){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 2, w, h - 4);
    ctx.clip();

    ctx.beginPath();
    for(let j=0; j<count; j++){
      const v = buf[buf.length - count + j];
      const x = (j / (count - 1)) * w;
      const y = envelopeY(cy, h, v);
      j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = m.color;
    ctx.lineWidth = 2.2;
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 12;
    ctx.globalAlpha = 0.78;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.moveTo(0, cy);
    for(let j=0; j<count; j++){
      const v = buf[buf.length - count + j];
      const x = (j / (count - 1)) * w;
      ctx.lineTo(x, envelopeY(cy, h, v));
    }
    ctx.lineTo(w, cy);
    ctx.closePath();
    ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.11)`;
    ctx.fill();
    ctx.restore();
  }

  const ampPx = h * lerp(MIN_AMP, MAX_AMP_FRAC, power);
  const hz = effectiveHz(m);
  s.wavePhase += dt * hz * Math.PI * 2;
  const spatialK = (Math.PI * 2 * WAVE_SPATIAL_CYCLES) / w;
  const steps = Math.max(40, Math.floor(w / 5));
  const neon = neonLineRgb(rgb);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 2, w, h - 4);
  ctx.clip();
  ctx.beginPath();
  for(let si=0; si<=steps; si++){
    const x = (si / steps) * w;
    const y = cy + ampPx * Math.sin(s.wavePhase - x * spatialK);
    si === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(${neon[0]},${neon[1]},${neon[2]},${255 * ENVELOPE_OVERLAY_ALPHA})`;
  ctx.lineWidth = 1.35;
  ctx.shadowColor = `rgb(${neon[0]},${neon[1]},${neon[2]})`;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.restore();
}

const bandState = MAPPING.map((m,i)=>({
  v: 0.5,
  target: [0.83, 0.40, 0.73, 0.31, 0.10][i] || 0.5,
  envelope: [],
  wavePhase: 0,
}));

const host = document.getElementById('band-rows-host');
MAPPING.forEach((m,i)=>{
  const last = i === MAPPING.length - 1;
  const lineClass = 'band-cell' + (last ? ' no-line' : '');
  const c = m.color;

  // 4 cells per row (mirrors React grid: BAND / POWER / CLASSIFICATION / FEATURE)
  host.insertAdjacentHTML('beforeend', `
    <div class="${lineClass}">
      <div class="band-name" style="color:${c}">
        <span class="sym" style="color:${c}">${m.sym}</span>${m.name}<span class="freq">${m.freq}</span>
      </div>
    </div>
    <div class="${lineClass}">
      <div class="band-wave">
        <canvas data-row="${i}"></canvas>
        <span class="val" style="color:${c}" data-val="${i}">0.00</span>
      </div>
    </div>
  `);
});

function sizeBandCanvases(){
  const dpr = window.devicePixelRatio || 1;
  document.querySelectorAll('#band-rows-host canvas').forEach(cv=>{
    const r = cv.getBoundingClientRect();
    const w = Math.max(2, Math.floor(r.width));
    const h = Math.max(2, Math.floor(r.height));
    cv.width  = w * dpr;
    cv.height = h * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
  });
}
window.addEventListener('resize', sizeBandCanvases);
requestAnimationFrame(sizeBandCanvases);

let bandLast = 0;
function bandLoop(ts){
  requestAnimationFrame(bandLoop);
  const dt = bandLast ? Math.min((ts-bandLast)/1000, .05) : .016;
  bandLast = ts;

  bandState.forEach((s,i)=>{
    const addr = window.__ntBandAddressByKey && window.__ntBandAddressByKey[MAPPING[i].band];
    if (addr && window.NtOscWs) {
      const raw = window.NtOscWs.getOscValue(addr);
      if (raw !== null) s.target = raw;
    }
    s.v += (s.target - s.v) * AMP_SMOOTH;
    for(let n=0; n<ENVELOPE_SCROLL; n++) s.envelope.push(s.v);
    while(s.envelope.length > ENVELOPE_HISTORY) s.envelope.shift();
  });

  document.querySelectorAll('#band-rows-host canvas').forEach(cv=>{
    const idx = +cv.dataset.row;
    const s   = bandState[idx];
    const m   = MAPPING[idx];
    const w   = cv.width  / (window.devicePixelRatio||1);
    const h   = cv.height / (window.devicePixelRatio||1);
    if(!w||!h) return;

    const ctx = cv.getContext('2d');
    drawEnvelopeScrollCanvas(ctx, w, h, s, m, dt);
    document.querySelector(`[data-val="${idx}"]`).textContent = s.v.toFixed(2);
  });
}
requestAnimationFrame(bandLoop);

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { RenderPass }    from 'three/addons/postprocessing/RenderPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── ELECTRODE MONTAGES ──────────────────────────────────────
// ENOBIO 32 — full 10–20 system
const ENOBIO_32 = [
  {n:'Fp1',x:-.18,y:.85},{n:'Fp2',x:.18,y:.85},
  {n:'AF3',x:-.35,y:.72},{n:'AF4',x:.35,y:.72},
  {n:'F7',x:-.71,y:.52},{n:'F3',x:-.38,y:.55},
  {n:'Fz',x:0,y:.55},{n:'F4',x:.38,y:.55},{n:'F8',x:.71,y:.52},
  {n:'FC5',x:-.60,y:.27},{n:'FC1',x:-.20,y:.27},
  {n:'FC2',x:.20,y:.27},{n:'FC6',x:.60,y:.27},
  {n:'T7',x:-.87,y:0},{n:'C3',x:-.45,y:0},
  {n:'Cz',x:0,y:0},{n:'C4',x:.45,y:0},{n:'T8',x:.87,y:0},
  {n:'CP5',x:-.60,y:-.27},{n:'CP1',x:-.20,y:-.27},

  {n:'P7',x:-.71,y:-.52},{n:'P3',x:-.38,y:-.55},

  {n:'PO7',x:-.49,y:-.72},{n:'PO3',x:-.25,y:-.75},
  {n:'PO4',x:.25,y:-.75},{n:'PO8',x:.49,y:-.72},
  {n:'Oz',x:0,y:-.87}
];

// MUSE — 4 dry electrodes
const MUSE_4 = [
  {n:'TP9',  x:-.85, y:-.05},
  {n:'AF7',  x:-.45, y:.78},
  {n:'AF8',  x: .45, y:.78},
  {n:'TP10', x: .85, y:-.05},
];

let CURRENT_MONTAGE = ENOBIO_32;
let currentName = 'enobio';

// ── RENDERER / SCENE ───────────────────────────────────────
const panel = document.getElementById('brain-panel');
const cvs   = document.getElementById('brain-canvas');
const renderer = new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000208,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText =
  'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;';
panel.appendChild(labelRenderer.domElement);

const scene  = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000208,0.045);
const camera = new THREE.PerspectiveCamera(50,1,0.1,200);
camera.position.set(1.0,1.2,6.2);

const orbit = new OrbitControls(camera,cvs);
orbit.enableDamping=true; orbit.dampingFactor=.07;
orbit.autoRotate=true; orbit.autoRotateSpeed=.42;
orbit.enableZoom=true; orbit.minDistance=3; orbit.maxDistance=14;
orbit.target.set(0,0.15,0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

function resize(){
  const W = panel.clientWidth, H = panel.clientHeight;
  renderer.setSize(W,H,false);
  camera.aspect = W/H; camera.updateProjectionMatrix();
  composer.setSize(W,H);
  labelRenderer.setSize(W,H);
}

// ── LIGHTING ──────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x8888aa,2));
const keyL=new THREE.DirectionalLight(0xffffff,3.5); keyL.position.set(2.5,5,3); scene.add(keyL);
const rimL=new THREE.DirectionalLight(0x4466ff,2.5); rimL.position.set(-4,-2,-3); scene.add(rimL);
const frtL=new THREE.DirectionalLight(0xaaddff,1.8); frtL.position.set(-2,2,5);  scene.add(frtL);
const topP=new THREE.PointLight(0xffffff,6,11);  topP.position.set(0,5,0);       scene.add(topP);
const innP=new THREE.PointLight(0x88ccff,3.0,6); innP.position.set(.2,.1,.3);    scene.add(innP);

// ── PARTICLES ──────────────────────────────────────────────
const pCount=600;
const pBuf=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=2.8+Math.random()*3.2;
  pBuf[i*3]=r*Math.sin(ph)*Math.cos(th)*1.1;
  pBuf[i*3+1]=r*Math.sin(ph)*Math.sin(th)*.88;
  pBuf[i*3+2]=r*Math.cos(ph)*1.28;
}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pBuf,3));
const pMesh=new THREE.Points(pGeo,new THREE.PointsMaterial({
  color:0x00ff99,size:.035,transparent:true,opacity:.42,sizeAttenuation:true
}));
scene.add(pMesh);

// ── ELECTRODE RENDERING ───────────────────────────────────
const elGeo=new THREE.SphereGeometry(.078,12,10);
const LOWC=new THREE.Color(0x00ffcc),MIDC=new THREE.Color(0xffaa00),HIC=new THREE.Color(0xff3000);
function actColor(v){
  const c=new THREE.Color();
  if(v<.5)c.lerpColors(LOWC,MIDC,v*2); else c.lerpColors(MIDC,HIC,(v-.5)*2);
  return c;
}

let elMeshes=[], elLabels=[], elLines=[], elState=[];
let brainRoot=null, brainBBox=null;
const caster = new THREE.Raycaster();

function clearElectrodes(){
  elMeshes.forEach(m=>{m.parent && m.parent.remove(m); m.material.dispose();});
  elLabels.forEach(l=>{l.parent && l.parent.remove(l); l.element?.remove();});
  elLines.forEach(l=>{l.parent && l.parent.remove(l); l.geometry.dispose(); l.material.dispose();});
  elMeshes=[]; elLabels=[]; elLines=[]; elState=[];
}

function placeElectrodes(montage){
  if(!brainRoot || !brainBBox) return;
  clearElectrodes();
  const center=new THREE.Vector3(); brainBBox.getCenter(center);
  const size  =new THREE.Vector3(); brainBBox.getSize(size);
  const maxDim=Math.max(size.x,size.y,size.z);
  const meshes=[]; brainRoot.traverse(o=>{if(o.isMesh && o!==window._faceMesh) meshes.push(o);});

  // Use larger spheres for 4-electrode Muse (sketch shows them prominently)
  const isSparse = montage.length <= 8;
  const radius   = isSparse ? .13 : .068;
  const sphere   = new THREE.SphereGeometry(radius, 16, 14);

  montage.forEach((e,i)=>{
    elState.push({v:.3+Math.random()*.4,target:Math.random(),phase:i*.43});

    const rad=Math.sqrt(e.x*e.x+e.y*e.y);
    const theta=rad*Math.PI/2, phi=Math.atan2(e.x,e.y);
    const dir=new THREE.Vector3(
      Math.sin(theta)*Math.sin(phi),
      Math.cos(theta),
      Math.sin(theta)*Math.cos(phi)
    ).normalize();

    const origin=dir.clone().multiplyScalar(maxDim*2).add(center);
    caster.set(origin,dir.clone().negate());
    const hits=caster.intersectObjects(meshes,true);
    const offsetOut = isSparse ? maxDim*.035 : maxDim*.018;
    const pos3=hits.length>0
      ? hits[0].point.clone().add(dir.clone().multiplyScalar(offsetOut))
      : dir.clone().multiplyScalar(maxDim*.54).add(center);

    const mat  = new THREE.MeshBasicMaterial({color:actColor(.5)});
    const mesh = new THREE.Mesh(sphere,mat);
    mesh.position.copy(pos3); mesh.userData={name:e.n,idx:i};
    scene.add(mesh); elMeshes.push(mesh);

    // Outer halo ring for sparse mode (Muse) — makes the 4 stand out
    if(isSparse){
      const ringGeo = new THREE.TorusGeometry(radius*1.6, radius*0.15, 12, 32);
      const ringMat = new THREE.MeshBasicMaterial({color:0x66ddff,transparent:true,opacity:.55});
      const ring    = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(pos3);
      ring.lookAt(center);
      scene.add(ring);
      elLines.push(ring); // reuse cleanup array
      mesh.userData.ring = ring;
    }

    // Label
    const div = document.createElement('div');
    div.textContent = e.n;
    div.className = 'el-label';
    const labelObj = new CSS2DObject(div);
    labelObj.position.copy(pos3).addScaledVector(dir, maxDim * (isSparse ? .12 : .07));
    scene.add(labelObj);
    elLabels.push(labelObj);

    // Radial connector line
    const inner = center.clone().add(pos3.clone().sub(center).multiplyScalar(.06));
    const lGeo  = new THREE.BufferGeometry().setFromPoints([
      inner, pos3.clone().sub(dir.clone().multiplyScalar(maxDim*.014))
    ]);
    const line = new THREE.Line(lGeo, new THREE.LineBasicMaterial({
      color: isSparse ? 0x66ddff : 0x00ffaa,
      transparent:true, opacity: isSparse ? .35 : .2
    }));
    scene.add(line); elLines.push(line);
  });
}

// ── LOAD BRAIN MODEL (fetch GLB file) ─────────────────────
const loadTxt = document.getElementById('load-txt');
loadTxt.textContent = 'DECODING MODEL…';

new Promise((resolve, reject) => {
  setTimeout(()=>{
    try{
      const bin = atob(window.__BRAIN_GLB_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      loadTxt.textContent = 'PARSING GEOMETRY…';
      new GLTFLoader().parse(bytes.buffer, '', resolve, reject);
    }catch(e){ reject(e); }
  }, 30);
})
  .then(gltf => {
    const root = gltf.scene;
    const bbox  = new THREE.Box3().setFromObject(root);
    const center= new THREE.Vector3(); bbox.getCenter(center);
    const size  = new THREE.Vector3(); bbox.getSize(size);
    const S     = 3.6 / Math.max(size.x,size.y,size.z);
    root.position.copy(center.clone().negate().multiplyScalar(S));
    root.scale.setScalar(S);

    const meshNodes = [];
    root.traverse(c => { if(c.isMesh) meshNodes.push(c); });

    window._wireMats = [];
    meshNodes.forEach(child => {
      // Wireframe
      child.material = new THREE.MeshBasicMaterial({
        color: 0xb855ff, wireframe: true, transparent: true, opacity: .65,
      });
      window._wireMats.push(child.material);

      // Vertex-coloured face mesh (ROYGBIV front→back)
      const faceGeo = child.geometry.clone();
      const pos = faceGeo.attributes.position;
      const lb  = new THREE.Box3().setFromBufferAttribute(pos);
      const ls  = new THREE.Vector3(); lb.getSize(ls);
      const ROY = [
        [1.00, 0.08, 0.08],
        [1.00, 0.48, 0.00],
        [0.98, 0.88, 0.00],
        [0.05, 0.82, 0.12],
        [0.08, 0.32, 1.00],
        [0.25, 0.00, 0.72],
        [0.58, 0.00, 0.88],
      ];
      const ca = new Float32Array(pos.count*3);
      for(let i=0;i<pos.count;i++){
        const t = (pos.getZ(i) - lb.min.z) / (ls.z || 1);
        const bucket = Math.min(6, Math.floor((1-t)*7));
        const [r,g,b] = ROY[bucket];
        ca[i*3]=r; ca[i*3+1]=g; ca[i*3+2]=b;
      }
      faceGeo.setAttribute('color', new THREE.BufferAttribute(ca,3));
      const faceMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness:.55, metalness:.05,
        transparent:true, opacity:.24,
        depthWrite:false, side:THREE.DoubleSide,
      });
      const faceMesh = new THREE.Mesh(faceGeo,faceMat);
      faceMesh.position.copy(child.position);
      faceMesh.quaternion.copy(child.quaternion);
      faceMesh.scale.copy(child.scale);
      root.add(faceMesh);
      window._faceMesh = faceMesh;
      window._faceMat  = faceMat;
    });
    scene.add(root);
    brainRoot = root;

    // Halo sphere
    const sb = new THREE.Box3().setFromObject(root);
    const sc = new THREE.Vector3(); sb.getSize(sc);
    const haloR = Math.max(sc.x,sc.y,sc.z) * 0.62;
    const haloGeo = new THREE.SphereGeometry(haloR, 16, 12);
    const haloMat = new THREE.MeshBasicMaterial({
      color:0xb855ff, wireframe:true, transparent:true, opacity:.14
    });
    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
    window._haloMat = haloMat;
    scene.add(haloMesh);
    window._haloMesh = haloMesh;

    brainBBox = sb;
    placeElectrodes(CURRENT_MONTAGE);
    // Apply initial brain colour (Kantor / cosmonaut purple)
    if(typeof setBrainColor === 'function') setBrainColor('#b855ff');

    // Fit camera
    const ctr = new THREE.Vector3(); sb.getCenter(ctr);
    const d   = Math.max(sc.x,sc.y,sc.z);
    camera.position.set(ctr.x+d*.25, ctr.y+d*.18, ctr.z+d*.95);
    orbit.target.copy(ctr);
    orbit.minDistance=d*.35; orbit.maxDistance=d*5;
    orbit.update();

    const ov=document.getElementById('load-ov');
    ov.classList.add('fade');
    setTimeout(()=>{ov.style.display='none';},700);
  })
  .catch(err=>{
    loadTxt.textContent = 'ERROR — SEE CONSOLE';
    console.error('Brain load error:', err);
  });

// ── HOVER TOOLTIP ────────────────────────────────────────
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const tip=document.getElementById('eltip');
let hovEl=null;
panel.addEventListener('mousemove',ev=>{
  if(!elMeshes.length){tip.style.display='none';return;}
  const rc=panel.getBoundingClientRect();
  mouse.x=((ev.clientX-rc.left)/rc.width)*2-1;
  mouse.y=-((ev.clientY-rc.top)/rc.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(elMeshes);
  if(hits.length){
    const m=hits[0].object,idx=m.userData.idx;
    tip.style.display='block';
    tip.style.left=(ev.clientX-rc.left+16)+'px';
    tip.style.top=(ev.clientY-rc.top-14)+'px';
    tip.innerHTML=`<b style="color:#00ff99">${m.userData.name}</b>&nbsp;&nbsp;${(elState[idx].v*100).toFixed(0)}%`;
    if(hovEl!==m){if(hovEl)hovEl.scale.setScalar(1);m.scale.setScalar(1.5);hovEl=m;}
  } else {
    tip.style.display='none';
    if(hovEl){hovEl.scale.setScalar(1);hovEl=null;}
  }
});
panel.addEventListener('mouseleave',()=>{tip.style.display='none';if(hovEl){hovEl.scale.setScalar(1);hovEl=null;}});

// ── MONTAGE TOGGLE ───────────────────────────────────────
window.setMontage = function(name){
  if(name === currentName) return;
  currentName = name;
  CURRENT_MONTAGE = (name === 'muse') ? MUSE_4 : ENOBIO_32;
  document.getElementById('btnEnobio').classList.toggle('on', name === 'enobio');
  document.getElementById('btnMuse').classList.toggle('on',   name === 'muse');
  const vt = document.getElementById('visitor-tog');
  const es = document.getElementById('enobio-sub');
  if(name === 'muse'){
    vt.style.display = 'flex';
    es.style.display = 'none';
    const onBtn = document.querySelector('#visitor-tog .vt-btn.on');
    setBrainColor(onBtn?.dataset.color || '#3dd9f0');
  } else {
    vt.style.display = 'none';
    es.style.display = 'flex';
    setBrainColor('#b855ff'); // KANTOR / cosmonaut purple
  }
  placeElectrodes(CURRENT_MONTAGE);
};

window.setVisitor = function(n){
  document.querySelectorAll('#visitor-tog .vt-btn').forEach(b=>{
    b.classList.toggle('on', +b.dataset.v === n);
  });
  const onBtn = document.querySelector(`#visitor-tog .vt-btn[data-v="${n}"]`);
  setBrainColor(onBtn.dataset.color);
};

// ── Brain colour control ──────────────────────────────────
window.toggleHalo = function(){
  const halo = window._haloMesh;
  if(!halo) return;
  halo.visible = !halo.visible;
  const btn = document.getElementById('haloBtn');
  btn.textContent = halo.visible ? '⊙ SPHERE ON' : '⊙ SPHERE OFF';
  btn.classList.toggle('off', !halo.visible);
};

function setBrainColor(hex){
  const c = new THREE.Color(hex);
  // Wireframe meshes (the .wireframe MeshBasicMaterial on the original meshes)
  (window._wireMats || []).forEach(m => m.color.copy(c));
  // Face mesh — drop vertex colours and apply tint
  if(window._faceMat){
    window._faceMat.vertexColors = false;
    window._faceMat.color.copy(c);
    window._faceMat.needsUpdate = true;
  }
  // Halo
  if(window._haloMat) window._haloMat.color.copy(c);
}
window.setBrainColor = setBrainColor;

// Style each visitor button: only the NUMBER/TEXT gets its accent colour.
// Borders stay green; .on adds a subtle green tint, not the accent.
function paintVisitorButtons(){
  document.querySelectorAll('.vt-btn[data-color]').forEach(b=>{
    const col = b.dataset.color;
    b.style.color = col;
    b.style.borderColor = '';
    b.style.background  = '';
    b.style.boxShadow   = '';
  });
}
// Repaint after every visitor change
const _origSetVisitor = window.setVisitor;
window.setVisitor = function(n){ _origSetVisitor(n); paintVisitorButtons(); };
const _origSetMontage = window.setMontage;
window.setMontage = function(name){ _origSetMontage(name); paintVisitorButtons(); };
paintVisitorButtons();

// ── ANIMATION LOOP ───────────────────────────────────────
let T=0,lastTs=0;
function animate(ts){
  requestAnimationFrame(animate);
  const dt=Math.min((ts-lastTs)/1000,.05); lastTs=ts;
  T += dt;

  elState.forEach((s,i)=>{
    if (window.NtOscWs && elMeshes[i]?.userData?.name) {
      const prefix = window.__ntMontageHardwarePrefix ? window.__ntMontageHardwarePrefix() : 'ENOB';
      const raw = window.NtOscWs.getOscValue(`/${prefix}/${elMeshes[i].userData.name}`);
      if (raw !== null) s.target = raw;
    }
    s.v += (s.target-s.v) * dt * 1.1;
    if(!elMeshes[i]) return;
    const fast = .1*Math.sin(6.283*10*T + s.phase);
    const act  = Math.max(0, Math.min(1, s.v+fast));
    elMeshes[i].material.color.copy(actColor(act));
    if(elMeshes[i]!==hovEl) elMeshes[i].scale.setScalar(.88 + act*.92);
    // Pulse the halo ring (sparse mode)
    if(elMeshes[i].userData.ring){
      const r = elMeshes[i].userData.ring;
      const pulse = 1 + 0.18*Math.sin(T*3 + s.phase);
      r.scale.setScalar(pulse);
      r.material.opacity = 0.35 + 0.25*Math.sin(T*3 + s.phase);
    }
  });

  const pulse = .5 + .5*Math.sin(T*.68);
  innP.intensity = 2 + pulse*2.5;
  topP.position.set(Math.sin(T*.24)*.7, 5, Math.cos(T*.24)*.5);
  if(window._faceMat){
    window._faceMat.emissive = window._faceMat.emissive || new THREE.Color();
    window._faceMat.emissive.setRGB(.06+.03*pulse, .06+.03*pulse, .08+.04*pulse);
  }

  pMesh.rotation.y = T*.016;
  pMesh.rotation.x = Math.sin(T*.055)*.032;

  orbit.update();
  composer.render();
  labelRenderer.render(scene,camera);
}

resize();
window.addEventListener('resize',()=>{resize(); sizeBandCanvases();});
animate(0);
</script>
